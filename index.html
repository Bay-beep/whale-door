<!doctype html>
<html lang="zh"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>门</title>
<style>body{background:#0f1720;color:#cfe;font:16px/1.6 system-ui;display:flex;align-items:center;justify-content:center;height:100vh;margin:0;text-align:center}a{color:#7fd}</style>
</head><body><div id="t">正在找门…</div>
<script>
(async () => {
  const box = document.getElementById('t');
  const api = 'https://api.github.com/repos/Bay-beep/whale-door/contents/doorway.txt';
  const hash = location.hash || '';
  let door = '';
  try {
    const j = await (await fetch(api, {cache:'no-store'})).json();
    door = atob((j.content||'').replace(/[\s
]/g,'')).trim();
  } catch (e) {}
  if (!door) {
    try { door = (await (await fetch('https://cdn.jsdelivr.net/gh/Bay-beep/whale-door@main/doorway.txt',{cache:'no-store'})).text()).trim(); } catch (e) {}
  }
  if (!door) { box.textContent = '门牌没读到，稍后再开一次'; return; }
  const dest = door.replace(/\/+$/,'') + '/login.html' + hash;
  box.innerHTML = '带你过去…<br><a href="'+dest+'">'+dest+'</a>';
  location.replace(dest);
})();
</script></body></html>
