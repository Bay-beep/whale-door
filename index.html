<!doctype html>
<html lang="zh"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>门</title>
<style>body{background:#0f1720;color:#cfe;font:16px/1.6 system-ui;display:flex;align-items:center;justify-content:center;height:100vh;margin:0;text-align:center}a{color:#7fd}small{opacity:.6}</style>
</head><body><div id="t">正在找门…</div>
<script>
(function(){
  var box = document.getElementById('t');
  var CDN = 'https://cdn.jsdelivr.net/gh/Bay-beep/whale-door@main/doorway.txt';
  var API = 'https://api.github.com/repos/Bay-beep/whale-door/contents/doorway.txt';
  var LAST = 'https://colored-apache-thomas-every.trycloudflare.com';
  var hash = location.hash || '';
  var KEY = 'whale-door-last';

  function get(url, pick, ms){
    return new Promise(function(res){
      var ctl = new AbortController();
      var timer = setTimeout(function(){ ctl.abort() }, ms || 3000);
      fetch(url + '?t=' + Date.now(), {cache:'no-store', signal: ctl.signal})
        .then(function(r){ return r.ok ? pick(r) : '' })
        .then(function(v){ clearTimeout(timer); res(v || '') })
        .catch(function(){ clearTimeout(timer); res('') });
    });
  }
  function text(r){ return r.text() }
  function json(r){ return r.json() }
  function clean(s){
    s = String(s || '').trim().split(/\s+/)[0];
    return /^https?:\/\//.test(s) ? s.replace(/\/+$/,'') : '';
  }

  get(CDN, text, 3000)
    .then(function(s){ return clean(s) || get(API, json, 3000).then(function(j){
        if (!j || !j.content) return '';
        try { return clean(decodeURIComponent(escape(atob(String(j.content).replace(/\s/g,''))))) } catch(e){ return '' }
      }) })
    .then(function(u){ return u || localStorage.getItem(KEY) || LAST })
    .then(function(u){
      u = u || LAST;
      try { localStorage.setItem(KEY, u) } catch(e){}
      location.replace(u + '/login.html' + hash);
    })
    .catch(function(){
      box.innerHTML = '门没找到…<br><small>试试点下面这个</small><br><a href="' + LAST + '/login.html' + hash + '">进来</a>';
    });
})();
</script>
</body></html>
