<!doctype html><meta charset="utf-8"><title>门</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>body{background:#111;color:#ddd;font:16px/1.8 system-ui;display:flex;flex-direction:column;gap:10px;align-items:center;justify-content:center;height:100vh;margin:0;text-align:center}a{color:#7cc}</style>
<p id="t">正在进去…<br><a id="a" href="#">门在这，点不开就用这个</a></p>
<div id="dbg" style="font-size:12px;color:#666"></div>
<script>
(function(){
  var S=["./door.txt",
         "https://cdn.jsdelivr.net/gh/Bay-beep/whale-door@main/door.txt",
         "https://raw.githubusercontent.com/Bay-beep/whale-door/main/doorway.txt",
         "https://api.github.com/repos/Bay-beep/whale-door/contents/doorway.txt"];
  var n=0;
  function clean(s){s=String(s||'').trim().split(/\s+/)[0];return /^https?:\/\//.test(s)?s.replace(/\/+$/,''):''}
  function read(u){var ctl=new AbortController();var t=setTimeout(function(){ctl.abort()},3500);
    return fetch(u+(u.indexOf('?')<0?'?':'&')+'t='+Date.now(),{cache:'no-store',signal:ctl.signal})
    .then(function(r){clearTimeout(t);if(!r.ok)return '';return u.indexOf('api.github.com')>0?r.json().then(function(j){try{return decodeURIComponent(escape(atob(String(j.content).replace(/\s/g,''))))}catch(e){return ''}}):r.text()})
    .then(clean).catch(function(){clearTimeout(t);return ''})}
  function alive(u){return new Promise(function(res){var i=new Image(),t=setTimeout(function(){res(false)},4000);
    i.onload=function(){clearTimeout(t);res(true)};i.onerror=function(){clearTimeout(t);res(false)};
    i.src=u+'/icon-192.png?t='+Date.now()})}
  function dbg(s){document.getElementById('dbg').textContent=s}
  function tryNext(){ if(n++>5){dbg('没找到开着的门，等会儿再刷');setTimeout(function(){n=0;tryNext()},5000);return}
    Promise.all(S.map(read)).then(function(list){
      dbg('候选 '+list.filter(Boolean).length+' 条');
      var seen={},cands=list.filter(function(u){if(!u||seen[u])return false;seen[u]=1;return true});
      if(!cands.length){setTimeout(tryNext,2500);return}
      var i=0;(function step(){
        if(i>=cands.length){setTimeout(tryNext,2500);return}
        var u=cands[i++];alive(u).then(function(ok){ if(ok){location.replace(u+'/login.html'+location.hash)} else step() })
      })()
    })
  }
  tryNext()
})()
</script>
